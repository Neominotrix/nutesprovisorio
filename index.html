<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPGECS - Portal Gerenciado via Planilha</title>
    <style>
        :root {
            --primaria-azul: #073488;
            --destaque-lavanda: #B7B7E3;
            --fundo-suave: #F2EFFD;
            --branco: #ffffff;
            --texto: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            background-color: var(--fundo-suave);
            color: var(--texto);
        }

        .container { width: 85%; max-width: 1200px; margin: 0 auto; }

        header {
            background-color: var(--branco);
            border-bottom: 4px solid var(--destaque-lavanda);
            padding: 20px 0;
        }

        .hero {
            background: linear-gradient(135deg, var(--primaria-azul), var(--destaque-lavanda));
            padding: 50px 0;
            color: white;
            text-align: center;
        }

        .news-card {
            background: var(--branco);
            padding: 30px;
            margin: 40px auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Efeito de carregamento */
        .loading { color: #999; font-style: italic; }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1 id="titulo_site" class="loading">Carregando título...</h1>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h2 id="banner_titulo" class="loading">Carregando...</h2>
    </div>
</section>

<div class="container">
    <main class="news-card">
        <h3>Notícia Principal</h3>
        <p id="noticia_principal" class="loading">Buscando informações na planilha...</p>
    </main>
</div>

<script>
   // Substitua pelo seu link de publicação CSV do Google
const SHEET_CSV_URL = 'COLE_Ahttps://docs.google.com/spreadsheets/d/e/2PACX-1vQHT89EHbgdJs3hGaNeJcJRQ6ufcFdkGgaewwl_Ff4qSpbeMBDXUWnmEB7cBph5EWakag-lLPvqF_S-/pub?output=csvQUI_O_LINK_DO_PASSO_1'; 

async function carregarConteudo() {
    try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error('Falha na rede');
        
        const data = await response.text();
        
        // Divide o CSV em linhas e trata aspas e vírgulas do Google
        const linhas = data.split(/\r?\n/);
        const conteudo = {};

        linhas.forEach(linha => {
            // Separa apenas na primeira vírgula encontrada (ID, Conteúdo)
            const partes = linha.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            if (partes && partes.length >= 2) {
                const id = partes[0].replace(/"/g, '').trim();
                const texto = partes[1].replace(/"/g, '').trim();
                conteudo[id] = texto;
            }
        });

        // Aplica os textos se os IDs existirem na planilha
        if(conteudo.titulo_site) document.getElementById('titulo_site').innerText = conteudo.titulo_site;
        if(conteudo.banner_titulo) document.getElementById('banner_titulo').innerText = conteudo.banner_titulo;
        if(conteudo.noticia_principal) document.getElementById('noticia_principal').innerText = conteudo.noticia_principal;

        // Remove a classe de loading
        document.querySelectorAll('.loading').forEach(el => el.classList.remove('loading'));

    } catch (error) {
        console.error('Erro detalhado:', error);
        // Se der erro, ele avisa na tela o que pode ser
        alert("Atenção: Para testar, você precisa subir o arquivo para um servidor (como GitHub Pages) ou usar um servidor local (Live Server no VS Code).");
    }
}

carregarConteudo();

    carregarConteudo();
</script>

</body>
</html>
