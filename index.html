<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPGECS - Portal NUTES</title>
    <style>
        :root {
            --primaria-azul: #073488;
            --destaque-lavanda: #B7B7E3;
            --fundo-suave: #F2EFFD;
            --branco: #ffffff;
            --texto: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            background-color: var(--fundo-suave);
            color: var(--texto);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Ajustado para Nomes Longos */
        header {
            background-color: var(--branco);
            border-bottom: 4px solid var(--destaque-lavanda);
            padding: 20px 0;
            text-align: center;
        }

        #titulo_site {
            margin: 0;
            font-size: 1.4rem; /* Diminuído para caber o nome do Instituto */
            color: var(--primaria-azul);
            text-transform: uppercase;
            padding: 0 15px;
            word-wrap: break-word;
        }

        /* Banner Hero */
        .hero {
            background: linear-gradient(135deg, var(--primaria-azul), var(--destaque-lavanda));
            padding: 60px 20px;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #banner_titulo {
            margin: 0;
            font-size: 2rem;
            max-width: 800px;
        }

        /* Área de Conteúdo */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
        }

        .news-card {
            background: var(--branco);
            padding: 30px;
            margin: -30px auto 40px; /* Sobe um pouco para entrar no banner */
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .news-card h3 {
            color: var(--primaria-azul);
            border-bottom: 2px solid var(--fundo-suave);
            padding-bottom: 10px;
        }

        #noticia_principal {
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap; /* Mantém quebras de linha da planilha */
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1 id="titulo_site">Carregando...</h1>
    </div>
</header>

<section class="hero">
    <h2 id="banner_titulo">...</h2>
</section>

<div class="container">
    <main class="news-card">
        <h3>Notícia Principal</h3>
        <p id="noticia_principal">Sincronizando com a planilha...</p>
    </main>
</div>

<script>
    // Link da sua planilha (mantenha o que você já estava usando)
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQHT89EHbgdJs3hGaNeJcJRQ6ufcFdkGgaewwl_Ff4qSpbeMBDXUWnmEB7cBph5EWakag-lLPvqF_S-/pub?output=csv'; 

    async function carregarConteudo() {
        try {
            const response = await fetch(SHEET_CSV_URL);
            const data = await response.text();
            
            // Tratamento robusto para CSV
            const linhas = data.split(/\r?\n/);
            const conteudo = {};

            linhas.forEach(linha => {
                // Regex para lidar com vírgulas dentro do texto (como no nome do Instituto)
                const partes = linha.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                if (partes && partes.length >= 2) {
                    const id = partes[0].replace(/"/g, '').trim();
                    const texto = partes[1].replace(/"/g, '').trim();
                    conteudo[id] = texto;
                }
            });

            // Atualização dos campos
            if(conteudo.titulo_site) document.getElementById('titulo_site').innerText = conteudo.titulo_site;
            if(conteudo.banner_titulo) document.getElementById('banner_titulo').innerText = conteudo.banner_titulo;
            if(conteudo.noticia_principal) document.getElementById('noticia_principal').innerText = conteudo.noticia_principal;

        } catch (error) {
            console.error('Erro:', error);
        }
    }

    carregarConteudo();
</script>

</body>
</html>
